name: Publish npm package

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v7
      - name: Require the protected main branch
        shell: bash
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Refusing to publish from $GITHUB_REF; dispatch publish.yml from main." >&2
            exit 1
          fi
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Use an OIDC-capable npm CLI
        run: npm install --global npm@12.0.2
      - name: Refuse an already-published version
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          if npm view "sitepilot-mcp@${version}" version --json >/dev/null 2>&1; then
            echo "sitepilot-mcp@${version} already exists; refusing to republish it." >&2
            exit 1
          fi
          echo "sitepilot-mcp@${version} is unpublished."
      - name: Require the protected private-CI read credential
        shell: bash
        env:
          PRODUCT_CI_READ_TOKEN: ${{ secrets.PRODUCT_CI_READ_TOKEN }}
        run: |
          if [ -z "$PRODUCT_CI_READ_TOKEN" ]; then
            echo "PRODUCT_CI_READ_TOKEN is unavailable; refusing publication." >&2
            exit 1
          fi
      - name: Require successful authoritative product artifact parity
        id: product-parity
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.PRODUCT_CI_READ_TOKEN }}
          script: |
            const fs = require("node:fs");
            const source = JSON.parse(fs.readFileSync(".sitepilot-product-source.json", "utf8"));
            if (source.product_repository !== "jim788e/sitepilot-mcp" ||
                !/^[0-9a-f]{40}$/.test(source.product_sha) ||
                source.workflow !== "ci.yml" ||
                source.job !== "npm-artifact-parity") {
              core.setFailed("Invalid authoritative product source binding.");
              return;
            }
            const [owner, repo] = source.product_repository.split("/");
            const { data } = await github.rest.actions.listWorkflowRuns({
              owner,
              repo,
              workflow_id: source.workflow,
              head_sha: source.product_sha,
              status: "completed",
              per_page: 20,
            });
            for (const run of data.workflow_runs) {
              if (run.conclusion !== "success") continue;
              const { data: jobs } = await github.rest.actions.listJobsForWorkflowRun({
                owner,
                repo,
                run_id: run.id,
                filter: "latest",
                per_page: 100,
              });
              const parityJob = jobs.jobs.find(job =>
                job.name === source.job && job.conclusion === "success"
              );
              if (!parityJob) continue;
              const { data: artifacts } = await github.rest.actions.listWorkflowRunArtifacts({
                owner,
                repo,
                run_id: run.id,
                per_page: 100,
              });
              const artifactName = `npm-artifact-parity-${source.product_sha}`;
              const artifact = artifacts.artifacts.find(item =>
                item.name === artifactName && !item.expired
              );
              if (!artifact) continue;
              core.setOutput("run-id", String(run.id));
              core.setOutput("artifact-name", artifactName);
              core.setOutput("product-sha", source.product_sha);
              return;
            }
            core.setFailed(`No successful authoritative parity artifact exists for ${source.product_sha}.`);
      - name: Download immutable authoritative parity attestation
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.product-parity.outputs.artifact-name }}
          path: ${{ runner.temp }}/product-parity
          github-token: ${{ secrets.PRODUCT_CI_READ_TOKEN }}
          repository: jim788e/sitepilot-mcp
          run-id: ${{ steps.product-parity.outputs.run-id }}
      - name: Verify parity attestation binds this exact release
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          node scripts/verify-product-parity-attestation.mjs \
            "$RUNNER_TEMP/product-parity/npm-artifact-parity-attestation.json" \
            "${{ steps.product-parity.outputs.product-sha }}" \
            "$GITHUB_SHA" \
            "$version"
      - name: Require green CI for this exact commit
        uses: actions/github-script@v8
        with:
          script: |
            const { data } = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: "ci.yml",
              head_sha: context.sha,
              status: "completed",
              per_page: 20,
            });
            const passed = data.workflow_runs.some(run => run.conclusion === "success");
            if (!passed) core.setFailed(`No successful CI run exists for ${context.sha}.`);
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: Publish with provenance
        run: npm publish --provenance --access public
      - name: Verify registry metadata
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          for attempt in {1..20}; do
            if npm view "sitepilot-mcp@${version}" name version dist.integrity dist.tarball --json; then
              exit 0
            fi

            if [[ "${attempt}" -eq 20 ]]; then
              echo "sitepilot-mcp@${version} was not visible after 20 attempts" >&2
              exit 1
            fi

            sleep 15
          done
